<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; form-action 'self'; base-uri 'none'">
  <title>올더뮤 AI 콘텐츠 제작 가이드 · 입장</title>
  <style>
    :root{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#241d2e;background:#f7f3ec}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 80% 10%,#e8def7 0,transparent 30%),#f7f3ec}.card{width:min(100%,460px);padding:clamp(30px,6vw,48px);background:#fff;border:1px solid #ece6df;border-radius:28px;box-shadow:0 24px 70px #3b265914}.eyebrow{margin:0 0 20px;font-size:12px;font-weight:700;letter-spacing:.16em;color:#6f40bc}.mark{width:56px;height:56px;display:grid;place-items:center;border-radius:16px;background:#ede5f7;color:#6e32c6;font-size:26px;font-weight:700}h1{margin:24px 0 12px;font-size:clamp(28px,5vw,36px);letter-spacing:-.05em;line-height:1.2}p{margin:0;color:#6a6571;line-height:1.65}form{margin-top:32px}label{display:block;margin-bottom:9px;font-size:14px;font-weight:700}input{width:100%;padding:16px 18px;border:1px solid #d6d1d9;border-radius:12px;background:#fff;font:inherit;font-size:16px}input:focus{outline:3px solid #d9c5f5;border-color:#7d46c7}button{width:100%;margin-top:14px;padding:17px;border:0;border-radius:12px;background:#6e32c6;color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.error{min-height:23px;margin-top:14px;color:#b42338;font-size:14px}.foot{margin-top:22px;font-size:12px;color:#918a97}
  </style>
  <script src="login.js" defer></script>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">A</div>
    <h1>AI 콘텐츠 제작 가이드</h1>
    <p>내부 자료입니다. 공유받은 비밀번호를 입력해 주세요.</p>
    <form id="login-form">
      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button id="enter" type="submit">가이드 보기</button>
      <div class="error" id="error" role="alert" aria-live="polite"></div>
    </form>
    <p class="foot">Age@Labs · Oldernew</p>
  </main>
</body>
</html>
